import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.metro)
    alias(libs.plugins.ksp)
}

android {
    // Kept as the original app namespace so that existing `com.eywa.projectclava.R` references still resolve
    namespace 'com.eywa.projectclava'
    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        minSdk libs.versions.minSdk.get().toInteger()

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        ksp {
            arg('room.schemaLocation', "$projectDir/schemas")
        }
    }

    buildTypes {
        create("releaseCheck") {
            initWith(getByName("release"))
        }
    }
    compileOptions {
        // Required by kotlinx-datetime below API 26
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.activity.compose
    implementation libs.compose.ui
    implementation libs.compose.ui.tooling.preview
    implementation libs.compose.material
    implementation libs.compose.material3
    testImplementation libs.junit
    debugImplementation libs.compose.ui.tooling
    debugImplementation libs.compose.ui.test.manifest

    implementation libs.room.runtime
    ksp libs.room.compiler
    implementation libs.room.ktx

    implementation libs.navigation.compose

    implementation libs.datastore.preferences

    // Using this instead of java.utils.Calendar, etc. to support KMP
    implementation libs.kotlinx.datetime
    coreLibraryDesugaring libs.desugar.jdk.libs
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
    }
}
