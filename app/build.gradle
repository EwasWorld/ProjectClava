import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'dev.zacsweers.metro'
    id 'com.google.devtools.ksp'
}

/*
 * Versioning
 */
ext.minimumSdkVersion = 21 // 2 digits
ext.versionMajor = 1 // 2 digits
ext.versionMinor = 3 // 2 digits
ext.versionPatch = 0 // 2 digits
ext.extraInfo = 0 // 1 digit (currently unused)
ext.versionClassifier = null // Extra info to be appended to version name e.g. alpha (used for version name)
ext.isSnapshot = false // Will append SNAPSHOT to version name

@SuppressWarnings('GrMethodMayBeStatic')
private Integer generateVersionCode() {
    // There is one digit spare between min sdk and major version
    return ext.minimumSdkVersion * 10000000 + ext.extraInfo * 1000000 + ext.versionMajor * 10000 + ext.versionMinor * 100 + ext.versionPatch
}

@SuppressWarnings('GrMethodMayBeStatic')
private String generateVersionName() {
    String versionName = "${ext.versionMajor}.${ext.versionMinor}.${ext.versionPatch}"
    if (ext.versionClassifier == null && ext.isSnapshot) {
        ext.versionClassifier = "SNAPSHOT"
    }

    if (ext.versionClassifier != null) {
        versionName += "-" + ext.versionClassifier
    }
    return versionName
}

android {
    namespace 'com.eywa.projectclava'
    compileSdk 36

    defaultConfig {
        applicationId "com.eywa.projectclava"
        minSdk project.ext.minimumSdkVersion
        targetSdk 36
        versionCode generateVersionCode()
        versionName generateVersionName()

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        ksp {
            arg('room.schemaLocation', "$projectDir/schemas")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        create("releaseCheck") {
            initWith(getByName("release"))
//            manifestPlaceholders["hostName"] = "internal.example.com"
            applicationIdSuffix = ".releaseCheck"
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        // Required by kotlinx-datetime below API 26
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // Bumping requires minSdk 23
    implementation 'androidx.core:core-ktx:1.17.0'
    // Bumping requires minSdk 23
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.4'
    // Bumping requires minSdk 23
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation "androidx.compose.ui:ui:$compose_ui_version"
    implementation "androidx.compose.ui:ui-tooling-preview:$compose_ui_version"
    // Bumping causes androidx.compose.material.icons package to not be recognised
    implementation "androidx.compose.material:material:1.7.0"
    implementation "androidx.compose.material3:material3:1.4.0"
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:$compose_ui_version"
    debugImplementation "androidx.compose.ui:ui-tooling:$compose_ui_version"
    debugImplementation "androidx.compose.ui:ui-test-manifest:$compose_ui_version"

    // Bumping requires minSdk 23
    def room_version = "2.7.2"
    implementation("androidx.room:room-runtime:$room_version")
    ksp "androidx.room:room-compiler:$room_version"
    implementation("androidx.room:room-ktx:$room_version")

    // Bumping requires minSdk 23
    // Note this lib is deprecated!
    def nav_version = "2.9.8"
    implementation("androidx.navigation:navigation-compose:$nav_version")

    // Bumping requires minSdk 23
    implementation "androidx.datastore:datastore-preferences:1.1.7"

    // Using this instead of java.utils.Calendar, etc. to support KMP
    implementation "org.jetbrains.kotlinx:kotlinx-datetime:0.8.0"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
    }
}