import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'dev.zacsweers.metro'
    id 'com.google.devtools.ksp'
}

android {
    // Kept as the original app namespace so that existing `com.eywa.projectclava.R` references still resolve
    namespace 'com.eywa.projectclava'
    compileSdk compile_sdk

    defaultConfig {
        minSdk min_sdk

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        ksp {
            arg('room.schemaLocation', "$projectDir/schemas")
        }
    }

    buildTypes {
        create("releaseCheck") {
            initWith(getByName("release"))
        }
    }
    compileOptions {
        // Required by kotlinx-datetime below API 26
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
    }
}

dependencies {
    // Bumping requires compileSdk 37
    implementation 'androidx.core:core-ktx:1.18.0'
    // Bumping requires compileSdk 37
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation "androidx.compose.ui:ui:$compose_ui_version"
    implementation "androidx.compose.ui:ui-tooling-preview:$compose_ui_version"
    // Bumping causes androidx.compose.material.icons package to not be recognised
    implementation "androidx.compose.material:material:1.7.0"
    implementation "androidx.compose.material3:material3:1.4.0"
    testImplementation 'junit:junit:4.13.2'
    debugImplementation "androidx.compose.ui:ui-tooling:$compose_ui_version"
    debugImplementation "androidx.compose.ui:ui-test-manifest:$compose_ui_version"

    def room_version = "2.8.5"
    implementation("androidx.room:room-runtime:$room_version")
    ksp "androidx.room:room-compiler:$room_version"
    implementation("androidx.room:room-ktx:$room_version")

    // Bumping requires compileSdk 37
    // Note this lib is deprecated!
    def nav_version = "2.9.8"
    implementation("androidx.navigation:navigation-compose:$nav_version")

    implementation "androidx.datastore:datastore-preferences:1.2.1"

    // Using this instead of java.utils.Calendar, etc. to support KMP
    implementation "org.jetbrains.kotlinx:kotlinx-datetime:0.8.0"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
    }
}
