import org.jetbrains.kotlin.gradle.dsl.JvmTarget

/*
 * Thin Android application wrapper around :app
 * Holds only things specific to the installed app: versioning, application id, launcher resources, the DI graph root
 */

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.metro)
}

/*
 * Versioning
 */
ext.minimumSdkVersion = libs.versions.minSdk.get().toInteger() // 2 digits
ext.versionMajor = 2 // 2 digits
ext.versionMinor = 0 // 2 digits
ext.versionPatch = 0 // 2 digits
ext.extraInfo = 0 // 1 digit (currently unused)
ext.versionClassifier = null // Extra info to be appended to version name e.g. alpha (used for version name)
ext.isSnapshot = false // Will append SNAPSHOT to version name

@SuppressWarnings('GrMethodMayBeStatic')
private Integer generateVersionCode() {
    // There is one digit spare between min sdk and major version
    return ext.minimumSdkVersion * 10000000 + ext.extraInfo * 1000000 + ext.versionMajor * 10000 + ext.versionMinor * 100 + ext.versionPatch
}

@SuppressWarnings('GrMethodMayBeStatic')
private String generateVersionName() {
    String versionName = "${ext.versionMajor}.${ext.versionMinor}.${ext.versionPatch}"
    if (ext.versionClassifier == null && ext.isSnapshot) {
        ext.versionClassifier = "SNAPSHOT"
    }

    if (ext.versionClassifier != null) {
        versionName += "-" + ext.versionClassifier
    }
    return versionName
}

android {
    namespace 'com.eywa.projectclava.app'
    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        applicationId "com.eywa.projectclava"
        minSdk project.ext.minimumSdkVersion
        targetSdk libs.versions.targetSdk.get().toInteger()
        versionCode generateVersionCode()
        versionName generateVersionName()

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        create("releaseCheck") {
            initWith(getByName("release"))
//            manifestPlaceholders["hostName"] = "internal.example.com"
            applicationIdSuffix = ".releaseCheck"
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
    }
    compileOptions {
        // Required by kotlinx-datetime below API 26
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation project(':app')

    androidTestImplementation libs.androidx.test.junit
    androidTestImplementation libs.androidx.test.espresso.core

    coreLibraryDesugaring libs.desugar.jdk.libs
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
    }
}
